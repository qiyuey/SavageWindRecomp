# Compiles the runtime on real Windows without locally generated game code.
# This is the check a Linux container cannot give: the Windows target's own headers, import libraries and
# windres. Locally (a Linux host) the alternatives are a Windows VM under QEMU or a mingw-w64 cross build, neither of
# which reproduces the MSYS2 setup.
name: Windows

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make curl mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm
      - name: Build custom SDL3
        run: sh tools/build_ci_sdl.sh build/ci-sdl
      - name: Build
        run: |
          make -j$(nproc) runtime-objs build/savagewind-config.exe SDL3_ROOT=build/ci-sdl/install SDL3_LIBDIR=build/ci-sdl/install/bin SDL3_LIB=build/ci-sdl/install/lib/libSDL3.dll.a
